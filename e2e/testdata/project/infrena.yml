# The project the e2e suite applies against the in-process fake GCP.
#
# `project:` and `region:` are on the PROVIDER INSTANCE, not on the resource,
# and that is not a style choice. Almost no generated type declares `project`
# as an attribute -- the generator takes a type's attributes from its API body
# schema and a project is a path segment, never a body field -- so a resource
# block naming one is refused by infrena as an undeclared attribute. The
# instance is the only place it can be written. See gcprov's withScope.
project: gcp-e2e
environments:
  dev: {}
providers:
  - plugin: gcp
    project: infrena-e2e
    region: us-central1
resources:
  # gcp.trigger, and every field below is here because it makes the workflow
  # test something. See workflow_test.go's `workflowType` for why this type.
  #
  #   retry_policy.max_attempts is an INTEGER NESTED IN A DECLARED OBJECT, and
  #   it is what makes `a_second_plan_is_clean` a real test. JSON has no
  #   integers: the API answers 3 as a float, so without reconciliation state
  #   records a float where configuration holds an int, every plan proposes a
  #   change, and applying it cannot help because the next read returns a float
  #   again. A plan that never converges is the worst failure this provider can
  #   have, and this one line is the difference between catching it and not.
  #
  #   destination is a declared nested object, and event_filters a list of
  #   them: both go through the object and list arms of Reconcile rather than
  #   the scalar one.
  #
  #   labels is a free-form map, which is what drift is applied to.
  #
  # NESTED KEYS ARE WRITTEN IN snake_case ON PURPOSE, and that is the point of
  # this block rather than a style choice.
  #
  # Until infrena v0.14.1 this had to say the opposite: a nested `cloud_run`
  # was carried to the plugin verbatim and would have reached Google as a field
  # it has never heard of, because canonicalisation ran on TOP-LEVEL names only.
  # v0.14.1 resolves a declared alias at any depth under `fields`, and protocol
  # 6 adds `elem` so the same holds inside a repeated block.
  #
  # So `destination.cloud_run` below is the assertion: it only reaches the fake
  # as `cloudRun` if the host resolved it, and the apply only succeeds if it
  # did. Writing it the schema's way would have been correct either way, which
  # is exactly why it proved nothing.
  #
  # DO NOT READ THIS AS "infrena folds underscores". IT DOES NOT. Its foldName
  # is strings.ToLower and has never been anything else, so `cloud_run` does not
  # resolve to `cloudRun` by folding at any depth. It resolves because the
  # generator DECLARES `cloud_run` as an alias of `cloudRun` -- one snake_case
  # alias per camelCase attribute, 1447 at the top level and 9788 nested.
  #
  # The distinction is not pedantry. An attribute this generator did not emit an
  # alias for accepts only exact and case-only spellings, so a snake_case
  # spelling of it fails while the one below succeeds, and a reader who inferred
  # underscore-folding from this passing test would have no idea why. That exact
  # inference is a mistake already made once here, from reading a function's
  # NAME instead of its six lines.
  bus:
    type: gcp.trigger
    name: e2e-trigger
    labels:
      owner: platform
    eventFilters:
      - attribute: type
        value: google.cloud.pubsub.topic.v1.messagePublished
    destination:
      cloud_run:
        service: e2e-service
        region: us-central1
    retryPolicy:
      maxAttempts: 3
